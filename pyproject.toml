[project]
name = "ganot8"
version = "0.1.0"
description = "Annotate, highlight and redact images on GNOME"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # PyGObject's asyncio integration, not ours; noisy under Python 3.14.
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning:gi.events",
]

[tool.ruff]
line-length = 100
target-version = "py314"
