# Flatpak manifest for Ganot8.
#
# NOT VERIFIED. flatpak-builder is not installed on the development machine and
# no GNOME runtime is available there, so this has never been built. The source
# URLs and checksums below were fetched from PyPI and are correct; the build
# steps are conventional but unproven. Treat it as a starting point and expect
# to iterate. See docs/SPEC.md section 13.
#
#   flatpak install flathub org.gnome.Platform//49 org.gnome.Sdk//49
#   flatpak-builder --user --install --force-clean _flatpak io.github.martinb.Ganot8.yml
#   flatpak run io.github.martinb.Ganot8

id: io.github.martinb.Ganot8
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: ganot8

finish-args:
  # Wayland first, X11 as a fallback.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Opening and exporting images the user chooses. The file chooser itself goes
  # through the portal, so no blanket filesystem access is requested.
  - --filesystem=xdg-pictures
  # Screenshots are taken through org.freedesktop.portal.Screenshot, which needs
  # no extra permission: the portal is always reachable from inside a sandbox.

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: pycairo
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=/app .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/bb/5e/19ab2572981a996ce96b853a189d2dcced40506b67d9555a7568457abcf2/pycairo-1.29.2.tar.gz
        sha256: 3e69fff74fe64f5ba2dfa31f67c6bdf26413342574047437d2ac520d35e9a489

  - name: pygobject
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=/app .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/65/1e/d590f82e14db75945b03f6b63e0f19662e0340babd8f574fdb1bb5a015e2/pygobject-3.58.1.tar.gz
        sha256: 4c80598ade17fbaa7798e01a25d0bf29ce109740786026a074c5c62bb3e79d23

  - name: pillow
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=/app .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/ce/a4/9cc30690a394a8305e8be4c9036aa16d0dfddadd09079860b582f562496d/pillow-13.0.0.tar.gz
        sha256: cdcd1ba258178f7356d74170c9a81ba4eab6a5d55748bc402a5a2a6fe6be3510

  - name: ganot8
    buildsystem: meson
    config-opts:
      - -Dpython=/usr/bin/python3
    sources:
      - type: dir
        path: .
